<style>
        /* Mystic Modernism Styles */
        .glass-panel {
            background-color: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        
        .glass-card-hover {
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .glass-card-hover:hover {
            transform: translateY(-4px);
            background-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 40px -10px rgba(70, 72, 212, 0.15);
        }

        /* Ambient Orbs Animation */
        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
            100% { transform: translateY(0px) scale(1); }
        }
        .orb-float-1 { animation: float 12s ease-in-out infinite; }
        .orb-float-2 { animation: float 15s ease-in-out infinite reverse; }

        /* Icon Float Animation inside Cards */
        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .group:hover .icon-float {
            animation: gentle-bounce 2s ease-in-out infinite;
            color: #4648d4; /* Tailwind primary */
        }
    </style>
</head>
<body class="bg-background min-h-screen font-body-md text-on-surface relative overflow-hidden flex flex-col justify-center items-center">
<!-- Background Ambient Glows (Level 0) -->
<div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
<div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-secondary-fixed/40 blur-[100px] orb-float-1"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] rounded-full bg-surface-container-high/60 blur-[120px] orb-float-2"></div>
<div class="absolute top-[40%] left-[30%] w-[400px] h-[400px] rounded-full bg-primary-fixed/30 blur-[90px] orb-float-1" style="animation-delay: -5s;"></div>
</div>
<!-- Main Content Canvas (Level 1) -->
<main class="w-full max-w-container-max px-margin-mobile md:px-margin-desktop z-10 flex flex-col items-center">
<!-- Glassmorphic Welcome Card -->
<div class="glass-panel rounded-[24px] w-full max-w-4xl p-stack-md md:p-stack-lg flex flex-col items-center text-center shadow-[0_8px_32px_rgba(19,27,46,0.03)] relative overflow-hidden">
<!-- Subtle geometric mandala accent (top right) -->
<svg class="absolute -top-12 -right-12 w-48 h-48 text-primary/5 rotate-45 pointer-events-none" fill="currentColor" viewbox="0 0 100 100">
<path d="M50 0L55 45L100 50L55 55L50 100L45 55L0 50L45 45L50 0Z"></path>
</svg>
<!-- Header -->
<h1 class="font-headline-md text-headline-md md:font-display-lg md:text-display-lg text-primary tracking-tight mb-stack-sm">
                BEFORE WE BEGIN...
            </h1>
<!-- Context -->
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mb-stack-lg">
                According to Ayurveda, Prakriti describes an individual's constitutional pattern.
            </p>
<!-- Interactive Elements Grid (Doshas) -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-gutter w-full mb-stack-lg">
<!-- VATA Card -->
<div class="glass-panel glass-card-hover rounded-[20px] p-stack-md flex flex-col items-center justify-center group cursor-default">
<div class="w-16 h-16 rounded-full bg-surface-container-highest flex items-center justify-center mb-4 transition-colors group-hover:bg-primary-fixed">
<span class="material-symbols-outlined text-[32px] text-tertiary transition-colors icon-float" data-icon="air" data-weight="fill" style="font-variation-settings: 'FILL' 1;">air</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-1">VATA</h3>
<p class="font-label-sm text-label-sm text-secondary tracking-widest uppercase">SPACE + AIR</p>
</div>
<!-- PITTA Card -->
<div class="glass-panel glass-card-hover rounded-[20px] p-stack-md flex flex-col items-center justify-center group cursor-default">
<div class="w-16 h-16 rounded-full bg-surface-container-highest flex items-center justify-center mb-4 transition-colors group-hover:bg-primary-fixed">
<span class="material-symbols-outlined text-[32px] text-tertiary transition-colors icon-float" data-icon="local_fire_department" data-weight="fill" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-1">PITTA</h3>
<p class="font-label-sm text-label-sm text-secondary tracking-widest uppercase">FIRE</p>
</div>
<!-- KAPHA Card -->
<div class="glass-panel glass-card-hover rounded-[20px] p-stack-md flex flex-col items-center justify-center group cursor-default">
<div class="w-16 h-16 rounded-full bg-surface-container-highest flex items-center justify-center mb-4 transition-colors group-hover:bg-primary-fixed">
<span class="material-symbols-outlined text-[32px] text-tertiary transition-colors icon-float" data-icon="water_drop" data-weight="fill" style="font-variation-settings: 'FILL' 1;">water_drop</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-1">KAPHA</h3>
<p class="font-label-sm text-label-sm text-secondary tracking-widest uppercase">WATER + EARTH</p>
</div>
</div>

                DISCOVER MINE 
                <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
