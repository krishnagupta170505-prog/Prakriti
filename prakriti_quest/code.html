<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.choice-btn');
            
            buttons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    
                    // Reset all buttons
                    buttons.forEach(b => {
                        b.classList.remove('ring-2', 'ring-primary/50', 'bg-surface-container-high', 'scale-[1.02]');
                        const icon = b.querySelector('.indicator-icon');
                        icon.classList.remove('text-primary');
                        icon.classList.add('text-transparent');
                        b.querySelector('span.font-body-md').classList.remove('font-bold', 'text-primary');
                    });

                    // Activate clicked button
                    this.classList.add('ring-2', 'ring-primary/50', 'bg-surface-container-high', 'scale-[1.02]');
                    const icon = this.querySelector('.indicator-icon');
                    icon.classList.remove('text-transparent');
                    icon.classList.add('text-primary');
                    this.querySelector('span.font-body-md').classList.add('font-bold', 'text-primary');

                    // Particle Effect
                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    for (let i = 0; i < 8; i++) {
                        createParticle(this, x, y);
                    }
                    
                    // Simulate progression delay (Optional, for realistic feel)
                    // setTimeout(() => { /* proceed to next question */ }, 800);
                });
            });

            function createParticle(parent, x, y) {
                const particle = document.createElement('div');
                particle.className = 'absolute w-1.5 h-1.5 rounded-full pointer-events-none z-20';
                
                // Randomize colors between primary and secondary for mystic feel
                const colors = ['bg-primary', 'bg-secondary', 'bg-secondary-container'];
                particle.classList.add(colors[Math.floor(Math.random() * colors.length)]);
                
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                parent.appendChild(particle);

                const angle = Math.random() * Math.PI * 2;
                const velocity = 30 + Math.random() * 50;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;

                particle.animate([
                    { transform: 'translate(-50%, -50%) scale(1)', opacity: 0.8 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
                ], {
                    duration: 600 + Math.random() * 400,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                }).onfinish = () => particle.remove();
            }
        });
    </script>
