<script>
        // Simple interaction script to show selected state
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.choice-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    // Reset all
                    buttons.forEach(b => {
                        b.classList.remove('bg-primary/10', 'border-primary');
                        const iconContainer = b.querySelector('.rounded-full');
                        iconContainer.classList.remove('bg-primary', 'border-primary', 'text-white');
                        iconContainer.classList.add('border-outline-variant', 'text-transparent');
                        b.querySelector('span:first-child').classList.remove('text-primary');
                    });

                    // Set active (Simulating selection before grading)
                    this.classList.add('bg-primary/10', 'border-primary');
                    const iconContainer = this.querySelector('.rounded-full');
                    iconContainer.classList.remove('border-outline-variant', 'text-transparent');
                    iconContainer.classList.add('bg-primary', 'border-primary', 'text-white');
                    this.querySelector('span:first-child').classList.add('text-primary');
                });
            });
        });
    </script>
