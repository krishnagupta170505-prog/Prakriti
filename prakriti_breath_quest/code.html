<style>
        body {
            background: linear-gradient(135deg, #eef0ff 0%, #dae2fd 50%, #f2daff 100%);
            background-attachment: fixed;
            overflow: hidden; /* Prevent scrolling during exercise */
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* Ambient Glow */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(70,72,212,0.15) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            transition: all 4s ease-in-out;
        }

        /* Breathing Animation */
        .breath-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(70,72,212,0.1) 0%, rgba(203,143,253,0.2) 100%);
            border: 2px solid rgba(70,72,212,0.3);
            box-shadow: 0 0 40px rgba(70,72,212,0.1), inset 0 0 40px rgba(255,255,255,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 4s cubic-bezier(0.4, 0.0, 0.2, 1), box-shadow 4s ease;
            position: relative;
        }

        .breath-circle::before {
            content: '';
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            border: 1px solid rgba(203,143,253,0.3);
            opacity: 0;
            transition: all 4s ease;
            transform: scale(0.8);
        }

        .state-inhale .breath-circle {
            transform: scale(1.5);
            box-shadow: 0 0 60px rgba(70,72,212,0.2), inset 0 0 20px rgba(255,255,255,0.8);
        }
        .state-inhale .breath-circle::before {
            opacity: 1;
            transform: scale(1.1);
        }

        .state-hold .breath-circle {
            transform: scale(1.5);
            box-shadow: 0 0 40px rgba(70,72,212,0.3), inset 0 0 20px rgba(255,255,255,0.8);
            border-color: rgba(203,143,253,0.5);
        }

        .state-exhale .breath-circle {
            transform: scale(1);
            box-shadow: 0 0 20px rgba(70,72,212,0.1), inset 0 0 40px rgba(255,255,255,0.5);
        }

        /* Animated Progress Ring */
        .progress-ring {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .progress-ring__circle {
            transition: stroke-dashoffset 1s linear;
            stroke-dasharray: 283; /* 2 * pi * r (45) */
            stroke-dashoffset: 283;
        }
    </style>
</head>
<body class="text-on-background h-screen w-screen flex flex-col items-center justify-center relative">
<!-- Ambient Background Elements -->

<div class="ambient-glow bottom-1/4 right-1/4" id="glow2" style="background: radial-gradient(circle, rgba(203,143,253,0.15) 0%, rgba(255,255,255,0) 70%);"></div>
<!-- Top App Bar (Task-Focused - Minimal) -->

<!-- Main Content Area -->

<circle class="progress-ring__circle text-primary" cx="48" cy="48" fill="transparent" id="timer-progress" r="45" stroke="currentColor" stroke-width="4"></circle>
</svg>

</button>

<div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-3xl z-10" id="icon-play-pause" style="font-variation-settings: 'FILL' 1;">play_arrow</span>

<!-- Bottom Nav Bar suppressed as per rule for focused task screens -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const breathContainer = document.getElementById('breath-container');
            const breathStateText = document.getElementById('breath-state');
            const instructionText = document.getElementById('instruction-text');
            const subInstructionText = document.getElementById('sub-instruction');
            const btnPlayPause = document.getElementById('btn-play-pause');
            const iconPlayPause = document.getElementById('icon-play-pause');
            const btnReset = document.getElementById('btn-reset');
            const timeDisplay = document.getElementById('time-display');
            const timerProgress = document.getElementById('timer-progress');
            
            let isRunning = false;
            let timeLeft = 30;
            const totalTime = 30;
            let timerInterval;
            let breathPhase = 'ready'; // ready, inhale, hold, exhale
            let phaseTimeout;

            const circumference = 2 * Math.PI * 45;
            timerProgress.style.strokeDasharray = `${circumference} ${circumference}`;
            timerProgress.style.strokeDashoffset = 0; // Start full

            function setProgress(percent) {
                const offset = circumference - percent / 100 * circumference;
                timerProgress.style.strokeDashoffset = offset;
            }

            function updateTimerDisplay() {
                timeDisplay.textContent = timeLeft;
                setProgress((timeLeft / totalTime) * 100);
            }

            function runBreathingCycle() {
                if (!isRunning) return;

                // 1. Inhale (4s)
                breathPhase = 'inhale';
                breathContainer.className = 'relative w-64 h-64 flex items-center justify-center mb-stack-lg state-inhale';
                breathStateText.textContent = 'INHALE';
                breathStateText.style.opacity = '1';
                instructionText.textContent = 'Breathe in...';
                instructionText.style.opacity = '1';
                
                phaseTimeout = setTimeout(() => {
                    if (!isRunning) return;
                    // 2. Hold (4s)
                    breathPhase = 'hold';
                    breathContainer.className = 'relative w-64 h-64 flex items-center justify-center mb-stack-lg state-hold';
                    breathStateText.textContent = 'HOLD';
                    instructionText.textContent = 'Hold...';
                    
                    phaseTimeout = setTimeout(() => {
                        if (!isRunning) return;
                        // 3. Exhale (4s)
                        breathPhase = 'exhale';
                        breathContainer.className = 'relative w-64 h-64 flex items-center justify-center mb-stack-lg state-exhale';
                        breathStateText.textContent = 'EXHALE';
                        instructionText.textContent = 'Breathe out...';
                        
                        phaseTimeout = setTimeout(() => {
                            if (!isRunning) return;
                            // Loop
                            runBreathingCycle();
                        }, 4000);
                    }, 4000);
                }, 4000);
            }

            function startTimer() {
                isRunning = true;
                iconPlayPause.textContent = 'pause';
                subInstructionText.style.opacity = '0';
                
                if (breathPhase === 'ready') {
                    runBreathingCycle();
                }

                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    
                    if (timeLeft <= 0) {
                        stopTimer();
                        instructionText.textContent = 'Session Complete';
                        subInstructionText.textContent = 'Great job.';
                        subInstructionText.style.opacity = '1';
                        breathContainer.className = 'relative w-64 h-64 flex items-center justify-center mb-stack-lg';
                        breathStateText.style.opacity = '0';
                    }
                }, 1000);
            }

            function pauseTimer() {
                isRunning = false;
                iconPlayPause.textContent = 'play_arrow';
                clearInterval(timerInterval);
                clearTimeout(phaseTimeout);
                
                // Keep current visual state, but update text to indicate pause
                instructionText.textContent = 'Paused';
            }

            function resetTimer() {
                pauseTimer();
                timeLeft = totalTime;
                breathPhase = 'ready';
                updateTimerDisplay();
                breathContainer.className = 'relative w-64 h-64 flex items-center justify-center mb-stack-lg';
                breathStateText.style.opacity = '0';
                instructionText.textContent = 'Take a moment.';
                subInstructionText.textContent = 'Just breathe.';
                subInstructionText.style.opacity = '1';
                iconPlayPause.textContent = 'play_arrow';
            }

            btnPlayPause.addEventListener('click', () => {
                if (isRunning) {
                    pauseTimer();
                } else {
                    if (timeLeft > 0) {
                        startTimer();
                    } else {
                        resetTimer();
                        startTimer();
                    }
                }
            });

            btnReset.addEventListener('click', resetTimer);
        });
    </script>
</body></html>
